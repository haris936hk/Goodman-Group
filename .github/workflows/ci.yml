name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_emulator_local
      CMS_TEST_BLOB_READ_WRITE_TOKEN: vercel_blob_rw_emulator_local
      CMS_TEST_BLOB_STORE_ID: emulator
      CMS_TEST_REAL_BLOB_READ_WRITE_TOKEN: ${{ secrets.CMS_TEST_BLOB_READ_WRITE_TOKEN }}
      CMS_TEST_REAL_BLOB_STORE_ID: ${{ vars.CMS_TEST_BLOB_STORE_ID }}
      VERCEL_BLOB_API_URL: http://127.0.0.1:3100/api/blob
      STORAGE_VERCEL_BLOB_BASE_URL: http://127.0.0.1:3100
      VERCEL_BLOB_RETRIES: "0"
      PAYLOAD_SECRET: goodman-ci-disposable-payload-secret-32chars-minimum
      CMS_TEST_ADMIN_EMAIL: cms-admin@example.test
      CMS_TEST_ADMIN_PASSWORD: Goodman-CI-only-password-92!

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Start disposable PostgreSQL
        run: |
          set -euo pipefail
          blob="$(docker run -d --rm -p 127.0.0.1:3100:3000 -e EMULATOR_BASE_URL=http://127.0.0.1:3100 ghcr.io/payloadcms/vercel-blob-emulator:latest)"
          echo "CMS_TEST_BLOB_CONTAINER=$blob" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --silent http://127.0.0.1:3100/api/blob >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then echo "Blob emulator did not become ready."; exit 1; fi
            sleep 1
          done
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          container="$(docker run -d --rm --label goodman.cms.disposable=true -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=goodman_test -p 127.0.0.1::5432 postgres:17-alpine)"
          echo "CMS_TEST_POSTGRES_CONTAINER=$container" >> "$GITHUB_ENV"
          port="$(docker port "$container" 5432/tcp | sed 's/.*://')"
          echo "DATABASE_URL=postgresql://postgres:$password@127.0.0.1:$port/goodman_test" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U postgres -d goodman_test; then exit 0; fi
            sleep 1
          done
          echo "Disposable PostgreSQL did not become ready."
          exit 1

      - name: Prepare disposable CMS database and administrator
        run: npm run payload -- run scripts/cms-test-setup.ts

      - name: Run CMS integration tests
        run: npm run test:cms


      - name: Select dedicated real Blob store for production-mode checks
        run: |
          set -euo pipefail
          [[ "$CMS_TEST_REAL_BLOB_STORE_ID" =~ ^[a-zA-Z0-9]+$ ]] || { echo "CMS_TEST_BLOB_STORE_ID must identify a dedicated real test store."; exit 1; }
          [[ "$CMS_TEST_REAL_BLOB_READ_WRITE_TOKEN" == "vercel_blob_rw_${CMS_TEST_REAL_BLOB_STORE_ID}_"* ]] || { echo "A matching dedicated CMS_TEST_BLOB_READ_WRITE_TOKEN secret is required for production-mode checks."; exit 1; }
          echo "BLOB_READ_WRITE_TOKEN=$CMS_TEST_REAL_BLOB_READ_WRITE_TOKEN" >> "$GITHUB_ENV"
          echo "VERCEL_BLOB_API_URL=" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_VERCEL_BLOB_API_URL=" >> "$GITHUB_ENV"
          echo "STORAGE_VERCEL_BLOB_BASE_URL=" >> "$GITHUB_ENV"
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build standalone production application
        run: npm run build

      - name: Smoke production routes and assets
        run: |
          set -euo pipefail
          PORT=4173 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/goodman-next-smoke.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/goodman-next-smoke.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            cat /tmp/goodman-next-smoke.log
            echo "Standalone production server did not become ready on port 4173."
            exit 1
          fi

          npm run smoke:deployment -- http://127.0.0.1:4173

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run end-to-end tests
        run: npm run test:e2e:all

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Remove disposable services
        if: ${{ always() }}
        run: |
          if [ -n "${CMS_TEST_POSTGRES_CONTAINER:-}" ]; then docker rm --force "$CMS_TEST_POSTGRES_CONTAINER"; fi
          if [ -n "${CMS_TEST_BLOB_CONTAINER:-}" ]; then docker rm --force "$CMS_TEST_BLOB_CONTAINER"; fi

